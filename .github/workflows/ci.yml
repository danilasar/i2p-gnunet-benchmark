name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: coursework-overlay:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run fast tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            coursework-overlay:latest \
            bash -lc 'cargo test --manifest-path /workspace/Cargo.toml -p sam3 -p sam-sender -p sam-receiver && cargo test --manifest-path /workspace/Cargo.toml -p testbed --lib'

      - name: Run integration tests
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            coursework-overlay:latest \
            bash -lc 'cargo build --release --manifest-path /workspace/Cargo.toml && cp /workspace/target/release/sam-sender /usr/local/bin/sam-sender && cp /workspace/target/release/sam-receiver /usr/local/bin/sam-receiver && cargo test --manifest-path /workspace/Cargo.toml -p testbed -- --test-threads=1 --nocapture'
